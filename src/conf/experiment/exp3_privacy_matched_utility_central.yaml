name: exp3_privacy_matched_utility_central

runner: utility_privacy_plot
seed: 1

simulation:
  method: two_stage_poisson_tuning
  run_hp_configuration: H2
  stage: 2
  stage_1_end: 2000
  stage_2_end: 5000
  mu: 10
  target_epsilon: 2.3

run_mode:
  generate_stage_1_plan: false
  generate_stage_2_plan: false
  run_simulation_stage_1: false
  run_simulation_stage_2: false
  compile_result: true

compilation:
  targets: [utility_privacy]
  methods:
    - papernot_poisson_baseline
    - two_stage_tuning
    - two_stage_poisson_tuning
  target_epsilons: [0.2, 0.9, 1.6, 2.3, 3.0]
  target_mus: [5, 7, 10, 15, 20]

num_trials: 30
run_id: run_id_10
hp_configuration_ids: ["H1", "H2", "H3", "H4", "H5", "H6", "H7", "H8", "H9", "H10"]
eta: 0

poisson:
  # Public, data-independent model returned by the mechanism when K=0.
  k_zero_model_seed: 2027

two_stage:
  num_survivors: 3
  stage_2_expected_trials: 3

output:
  results_root: ${paths.results_root}

dataset:
  name: FashionMNIST
  batch_size: 300
  root: data/central
  download: true
  num_workers: 0
  pin_memory: false
  shuffle_train: true
  drop_last_train: false
  loss_fn: CrossEntropyLoss
  x_label: "x"
  y_label: "y"
  # The official public test split is divided once and identically for
  # every trajectory. Validation drives HPO; held-out test reports utility.
  public_evaluation_split:
    validation_fraction: 0.5
    seed: 2027
  model:
    hidden_width: 120
    activation:
      scale: 2.0
      inverse_temperature: 2.0
      offset: 1.0

  # Used only when name: synthetic.
  num_samples: 10000
  input_dim: 60
  num_classes: 10
  train_fraction: 0.8
  alpha: 0.0
  beta: 0.0
  iid: true
  cluster_seed: 0
  data_seed: 0
  split_seed: 0

  # Used only when name: imdb.
  dataset_id: stanfordnlp/imdb
  vocabulary_size: 20000
  minimum_token_frequency: 1
  maximum_sequence_length: 256

privacy:
  delta: 1e-5
  max_renyi_order: 1000
  sigma_search:
    initial_sigma: ${run_settings.noise_multiplier}
    minimum_sigma: 1e-3
    maximum_sigma: 1e3
    relative_tolerance: 1e-6
    max_iterations: 80

evaluation:
  selection:
    metric: validation_loss
    mode: min
    peak_tie_break: earliest
  utility:
    metrics:
      - test_loss
      - test_accuracy
    at: selected_checkpoint
