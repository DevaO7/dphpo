# src/conf/experiment/exp1_compute_matched_utility.yaml
# We control the resources through number of local updates

name: exp1_compute_matched_utility

runner: utility_compute_plot
seed: 1

simulation:
  method: two_stage_tuning
  run_hp_configuration: H2
  stage: 2
  stage_1_end: 75
  stage_2_end: 150

run_mode:
  generate_stage_1_plan: false
  generate_stage_2_plan: false
  run_simulation_stage_1: false
  run_simulation_stage_2: false
  compile_result: true

base_E_K_list: [5, 7, 10, 15, 20]
local_updates_schedule: [6, 50]
num_trials: 50
run_id: run_id_4
hp_configuration_ids: ["H1", "H2", "H3", "H4", "H5", "H6", "H7", "H8", "H9", "H10"]
eta: 0

output:
  results_root: ${paths.results_root}

two_stage:
  # Number of Stage-1 model/HP pairs released for refinement.
  num_survivors: 3
  # Mean of the Stage-2 top-1 TNB trial-count distribution.
  stage_2_expected_trials: 3

privacy:
  delta: 1e-5
  max_renyi_order: 100
  accounting_method: numerical

evaluation:
  selection:
    metric: train_loss
    mode: min
  utility:
    metrics:
      - train_loss
      - train_accuracy
      - test_loss
      - test_accuracy
    at: selection_round
