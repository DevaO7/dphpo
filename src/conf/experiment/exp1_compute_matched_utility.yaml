# src/conf/experiment/exp1_compute_matched_utility.yaml

name: exp1_compute_matched_utility

runner: utility_compute_plot
seed: 1

simulation:
  run_hp_configuration: H1
  times: 1
  stage: 1
  stage_1_end: 150

run_mode:
  generate_plan: true
  run_baseline_simulation: false
  generate_task_list: false

base_E_K_list: [5, 10, 15]
local_updates_schedule: [6, 50]
num_trials: 5
run_id: run_id_3
hp_configuration_ids: ["H1", "H2", "H3", "H4", "H5", "H6", "H7", "H8", "H9", "H10"]
eta: 0

output:
  results_root: ${paths.results_root}
  plan_filename: papernot_baseline.JSON

n_stage_tuning:
  E_K_each_stage: [3]
  
