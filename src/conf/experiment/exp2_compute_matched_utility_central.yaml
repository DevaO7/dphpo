
name: exp2_compute_matched_utility_central

runner: utility_compute_plot
seed: 1

simulation:
  method: two_stage_tuning
  run_hp_configuration: H2
  stage: 1
  stage_1_end: 2000
  stage_2_end: 5000

run_mode:
  generate_stage_1_plan: false
  generate_stage_2_plan: true
  run_simulation_stage_1: false
  run_simulation_stage_2: false
  compile_result: false

base_E_K_list: [5, 7, 10, 15, 20]
num_trials: 10
run_id: run_id_5
hp_configuration_ids: ["H1", "H2", "H3", "H4", "H5", "H6", "H7", "H8", "H9", "H10"]
eta: 0

two_stage:
  num_survivors: 3
  stage_2_expected_trials: 3

output:
  results_root: ${paths.results_root}

dataset:
  name: mnist
  batch_size: 300
  root: data/central
  download: true
  num_workers: 0
  pin_memory: false
  shuffle_train: true
  drop_last_train: false
  loss_fn: CrossEntropyLoss
  x_label: "x"
  y_label: "y"
  model:
    # FashionMNIST uses this width; MNIST uses the fixed Opacus CNN.
    hidden_width: 120
    activation:
      scale: 2.0
      inverse_temperature: 2.0
      offset: 1.0

  # Used only when name: synthetic.
  num_samples: 10000
  input_dim: 60
  num_classes: 10
  train_fraction: 0.8
  alpha: 0.0
  beta: 0.0
  iid: true
  cluster_seed: 0
  data_seed: 0
  split_seed: 0

  # Used only when name: imdb.
  dataset_id: stanfordnlp/imdb
  vocabulary_size: 20000
  minimum_token_frequency: 1
  maximum_sequence_length: 256

privacy:
  delta: 1e-5
  max_renyi_order: 1000

evaluation:
  selection:
    metric: train_loss
    mode: min
  utility:
    metrics:
      - train_loss
      - train_accuracy
      - test_loss
      - test_accuracy
    at: selection_round